<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#120e18">
    <link rel="icon" href="data:,">
    <title>Hollowbrook</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #120e18; overflow: hidden; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      /* the game fills the window at any size; it scales its own pixel art and menus */
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #120e18; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 color: #efe0c4; font: 600 18px/1.4 Georgia, "Times New Roman", serif; letter-spacing: 0.04em; background: #120e18; }
      #loading h1 { font-size: 34px; margin: 0 0 18px; color: #f2c94c; text-shadow: 0 2px 0 #3a2410; }
      #bar { width: min(420px, 70vw); height: 12px; border: 2px solid #c8a060; border-radius: 3px; }
      #fill { height: 100%; width: 0%; background: #f2c94c; transition: width 0.15s; }
      #note { margin-top: 12px; font-size: 14px; color: #a89a84; text-align: center; max-width: 80vw; }
      #error { display: none; margin-top: 16px; color: #ff9a8a; font-size: 15px; max-width: 80vw; text-align: center; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>Hollowbrook</h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="note">Loading the game&hellip;</div>
      <div id="error"></div>
    </div>
    <script src="Build/docs.loader.js"></script>
    <script>
      // Everything here is relative ("Build/...", "StreamingAssets"), so the game works from any
      // folder, e.g. https://<user>.github.io/<repository>/ on GitHub Pages.
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#fill");
      var note = document.querySelector("#note");
      var error = document.querySelector("#error");

      // keep game keys in the game: no page scrolling on Space or arrows, no focus jumping on Tab
      var gameKeys = ["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Tab", "Backquote"];
      window.addEventListener("keydown", function (e) { if (gameKeys.indexOf(e.code) >= 0) e.preventDefault(); }, { passive: false });
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });   // right click blocks and dodges
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });
      // phones: no pinch zoom or pull-to-refresh while playing
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/docs.data.unityweb",
        frameworkUrl: "Build/docs.framework.js.unityweb",
        codeUrl: "Build/docs.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Goodstein",
        productName: "Hollowbrook",
        productVersion: "1.0",
        // sharp but affordable on high-DPI phones
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, function (progress) {
        fill.style.width = Math.round(progress * 100) + "%";
        if (progress >= 0.9) note.textContent = "Starting…";
      }).then(function (unityInstance) {
        loading.style.display = "none";
        canvas.focus();
        window.hollowbrook = unityInstance;
      }).catch(function (message) {
        error.style.display = "block";
        error.textContent = "The game couldn't start:\n" + message + "\n\nIt needs a browser with WebGL 2 (current Chrome, Edge, Firefox or Safari).";
      });
    </script>
  </body>
</html>
